name: Build GHCR image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - patch_web.py
      - xiaoai_bridge/config.yaml
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read app version
        id: app
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' xiaoai_bridge/config.yaml)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate patch syntax
        run: python -m py_compile patch_web.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            APP_VERSION=${{ steps.app.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/xiaoai-ha-bridge-haos:${{ steps.app.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/xiaoai-ha-bridge-haos:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=XiaoAI to Home Assistant bridge for HAOS

      - name: Smoke-test patched image
        shell: bash
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/xiaoai-ha-bridge-haos:${{ steps.app.outputs.version }}"
          docker run --rm --entrypoint python "$IMAGE" -c "from pathlib import Path; s=Path('/app/web/index.html').read_text(); assert '<select class=\"r-e\">' in s; assert 'async function loadRuleDevices()' in s"
          test "$(docker inspect "$IMAGE" --format '{{ index .Config.Labels "io.hass.version" }}')" = "${{ steps.app.outputs.version }}"

      - name: Push verified image
        shell: bash
        run: |
          VERSION="${{ steps.app.outputs.version }}"
          docker push "ghcr.io/${{ github.repository_owner }}/xiaoai-ha-bridge-haos:$VERSION"
          docker push "ghcr.io/${{ github.repository_owner }}/xiaoai-ha-bridge-haos:latest"
